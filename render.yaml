databases:
  - name: django-db
    plan: free
    databaseName: gestionbatiment
    user: gestionbatiment_user

envVarGroups:
  - name: shared-config
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "django-backend-yfqd.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://frontend-sxu7.onrender.com"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

services:
  # --- Backend Django (API) ---
  - type: web
    name: django-backend
    runtime: python
    plan: free
    rootDir: config
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - fromGroup: shared-config
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_NAME
        fromDatabase:
          name: django-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: django-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: django-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: django-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: django-db
          property: port
      # - key: CELERY_BROKER_URL
      #   fromService:
      #     type: redis
      #     name: django-redis
      #     property: connectionString

