  # --- Cron Job (remplace Celery Beat sur le plan gratuit) ---
  - type: cron
    name: rappels-paiement-cron
    runtime: python
    plan: free
    rootDir: config
    schedule: "0 7 * * *"  # tous les jours a 7h00 UTC
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py envoyer_rappels_paiement"
    envVars:
      - fromGroup: shared-config
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_NAME
        fromDatabase:
          name: django-db
          property: database
      - key: DB_USER
